name: SPX Dip Alert (Daily)

on:
  schedule:
    - cron: "30 15 * * 1-5"  # Runs daily at 16:30 Europe/Berlin (15:30 UTC)

jobs:
  run-alert:
    runs-on: ubuntu-latest
    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      # Core behavior
      LOCAL_TZ: Europe/Berlin
      LOOKBACK_DAYS: "1095"
      DRY_RUN: "0"
      SAVE_PLOTS: "1"
      INLINE_IMAGE: "0"
      PLOT_LOOKBACK_DAYS: "180"
      RETENTION_DAYS: "30"

      # Directories (match config.py expectations)
      PLOTS_DIR: plots
      LOGS_DIR: logs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SPX Alert
        run: |
          python main.py

      - name: Upload logs and plots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spx-alert-artifacts
          path: |
            plots/**
            logs/**
          if-no-files-found: ignore
