name: SPX Alerts — Daily (Dip + Trend)

on:
  schedule:
    # Weekdays at 16:30 Europe/Berlin = 15:30 UTC
    - cron: "30 15 * * 1-5"

jobs:
  daily:
    runs-on: ubuntu-latest

    env:
      # Email credentials
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      # Core behavior
      LOCAL_TZ: Europe/Berlin
      LOOKBACK_DAYS: "1095"
      DRY_RUN: "0"               # LIVE mode!
      SAVE_PLOTS: "1"
      INLINE_IMAGE: "0"
      RETENTION_DAYS: "365"
      ATTACH_PLOT_ON_TEST: "1"   # irrelevant in daily mode

      # Peak window logic
      PEAK_WINDOW: "1y"          # can override ENV here

      # Dip / trend plot windows
      DIP_PLOT_LOOKBACK_DAYS: "180"
      TREND_PLOT_LOOKBACK_DAYS: "30"

      # Directories (must match config.py)
      PLOTS_DIR: plots
      LOGS_DIR: logs
      STATE_DIR: state

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p plots
          mkdir -p logs
          mkdir -p state

      - name: Run Dip + Trend alerts (all indices)
        run: |
          python main.py --index all --both-modes

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-alert-artifacts
          path: |
            plots
            logs
          if-no-files-found: ignore
