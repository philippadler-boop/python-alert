name: SPX Dip Alert (Daily)

on:
  schedule:
    - cron: "30 3 * * 1-5" 
  workflow_dispatch:
    inputs:
      am:
        description: 'Run AM manual alert (true/false)'
        required: false
        default: 'false'

jobs:
  run-alert:
    runs-on: ubuntu-latest

    env:
      # Email credentials
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      # Core behavior
      LOCAL_TZ: Europe/Berlin
      LOOKBACK_DAYS: "1095"
      DRY_RUN: "0"
      MANUAL_AM: ${{ github.event.inputs.am || 'false' }}
      SAVE_PLOTS: "1"
      INLINE_IMAGE: "0"
      RETENTION_DAYS: "30"

      DIP_PLOT_LOOKBACK_DAYS: "180"
      TREND_PLOT_LOOKBACK_DAYS: "30"

      PEAK_WINDOW: "1y"

      PLOTS_DIR: plots
      LOGS_DIR: logs
      STATE_DIR: state

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # RESTORE STATE (persisted memory)
      # -------------------------------
      - name: Restore state cache
        uses: actions/cache@v4
        id: state-cache
        with:
          path: state
          key: state-cache-v1

      - name: Ensure state directory exists
        run: mkdir -p state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------
      # MAIN EXECUTION (default = both modes)
      # -------------------------------
      - name: Run Alert Engine
        run: |
          python main.py --index all

      # ----------------------------------
      # SAVE BACK THE STATE FOR NEXT RUN
      # ----------------------------------
      - name: Save updated state cache
        uses: actions/cache/save@v4
        # Only attempt to save when the cache was not restored (avoids reservation collisions)
        if: steps.state-cache.outputs.cache-hit != 'true'
        with:
          path: state
          key: state-cache-v1

      - name: Upload logs and plots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-artifacts
          path: |
            plots/**
            logs/**
          if-no-files-found: ignore
