name: SPX Alert — Manual Test (Dip + Trend)

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Which index to test?"
        required: true
        type: choice
        options:
          - spx
          - ndx
          - sox
          - srvr
          - sruuf
          - remx
      bucket:
        description: "Dip test bucket to simulate"
        required: true
        type: choice
        options:
          - B10
          - B20
          - B70
      dry-run:
        description: "Set DRY_RUN=1 to avoid sending emails"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "0"

jobs:
  manual-test:
    runs-on: ubuntu-latest

    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      LOCAL_TZ: Europe/Berlin
      LOOKBACK_DAYS: "1095"
      SAVE_PLOTS: "1"
      INLINE_IMAGE: "0"
      RETENTION_DAYS: "30"
      ATTACH_PLOT_ON_TEST: "1"

      DIP_PLOT_LOOKBACK_DAYS: "180"
      TREND_PLOT_LOOKBACK_DAYS: "30"

      PEAK_WINDOW: "1y"

      PLOTS_DIR: plots
      LOGS_DIR: logs
      STATE_DIR: state

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p plots
          mkdir -p logs
          mkdir -p state

      - name: Run DIP test (simulated bucket)
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          python main.py \
            --index "${{ github.event.inputs.index }}" \
            --test-bucket "${{ github.event.inputs.bucket }}" \
            --dip-entry --test

      - name: Run TREND test (forced)
        env:
          DRY_RUN: ${{ github.event.inputs.dry-run }}
        run: |
          python main.py \
            --index "${{ github.event.inputs.index }}" \
            --trend-entry --test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-alert-${{ github.event.inputs.index }}-${{ github.event.inputs.bucket }}
          path: |
            plots
            logs
          if-no-files-found: warn
