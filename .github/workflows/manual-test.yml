name: SPX Dip Alert — Manual Test (Artifacts)

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Which test bucket to simulate?"
        required: true
        type: choice
        options:
          - B10   # -5% to -8%
          - B20   # -10% to -15%
          - B70   # -20%+

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      # Core behavior
      LOCAL_TZ: Europe/Berlin
      LOOKBACK_DAYS: "1095"
      DRY_RUN: "0"
      SAVE_PLOTS: "1"
      INLINE_IMAGE: "0"
      PLOT_LOOKBACK_DAYS: "180"
      RETENTION_DAYS: "30"
      ATTACH_PLOT_ON_TEST: "1"   # ensure test-bucket emails attach the plot

      # Directories (match config.py expectations)
      PLOTS_DIR: plots
      LOGS_DIR: logs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run simulated bucket (produces email, plot, csv)
        run: |
          python main.py --test-bucket "${{ github.event.inputs.bucket }}"

      - name: Upload artifacts (plots & log)
        uses: actions/upload-artifact@v4
        with:
          name: spx-alert-artifacts-${{ github.event.inputs.bucket }}
          path: |
            plots/**
            logs/**
          if-no-files-found: warn
